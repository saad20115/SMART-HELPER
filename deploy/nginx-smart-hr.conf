server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SUBDOMAIN; # ضع هنا السب دومين الخاص بك مثلاً: hr.yourdomain.com

    # مسار ملفات الواجهة بعد البناء
    root /var/www/smart-helper/client/dist;
    index index.html;

    # أقصى حجم لرفع ملفات الإكسل والنسخ الاحتياطية
    client_max_body_size 50M;

    # ضغط Gzip لتسريع التصفح
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # توجيه صفحات React SPA
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # التخزين المؤقت للأصول الثابتة (CSS, JS, Fonts, Images)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # توجيه طلبات الـ API إلى خادم NestJS
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # مهلة الاستجابة لعمليات الاستيراد والحسابات الكبيرة
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
